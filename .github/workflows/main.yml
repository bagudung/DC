name: Build DCU32INT

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build with FPC (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lazarus + FPC
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "stable"
          with-cache: false

      - name: Show FPC version
        run: fpc -iV

      - name: Patch op.pas untuk FPC compatibility
        shell: pwsh
        run: |
          # op.pas menggunakan identifier khusus Delphi (wasREX, getOS64, dll)
          # yang hanya ada di Delphi. Kita wrap seluruh isi dengan {$IFNDEF FPC}
          $file = "op.pas"
          $content = Get-Content $file -Raw
          # Cek apakah sudah di-patch sebelumnya
          if ($content -notmatch '\$IFNDEF FPC') {
            # Cari posisi setelah baris 'implementation'
            $patched = $content -replace '(?s)(implementation\s*\r?\n)(.*)(end\.)',
              "`$1{`$IFNDEF FPC}`r`n`$2{`$ENDIF}`r`n`$3"
            Set-Content $file $patched -NoNewline
            Write-Host "op.pas patched OK"
          } else {
            Write-Host "op.pas already patched"
          }

      - name: Patch DAsmUtil.pas untuk FPC compatibility
        shell: pwsh
        run: |
          $file = "DAsmUtil.pas"
          $content = Get-Content $file -Raw
          if ($content -notmatch 'CurREX.*FPC') {
            # Ganti identifier CurREX yang tidak ada di FPC dengan dummy
            $patched = $content -replace '\bCurREX\b', '{$IFDEF FPC}0{$ELSE}CurREX{$ENDIF}'
            Set-Content $file $patched -NoNewline
            Write-Host "DAsmUtil.pas patched OK"
          } else {
            Write-Host "DAsmUtil.pas already patched"
          }

      - name: Build DCU32INT (tanpa XMLx86)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin   | Out-Null
          New-Item -ItemType Directory -Force -Path output | Out-Null
          fpc -Mdelphi -O2 -FUoutput -FEbin DCU32INT.dpr

      - name: Verify binary
        shell: pwsh
        run: |
          Get-ChildItem bin\
          & ".\bin\dcu32int.exe" -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: bin\dcu32int.exe
          retention-days: 30

  release:
    name: Create Windows Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dcu32int.exe
          generate_release_notes: true
