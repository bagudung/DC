name: Build DCU32INT

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build with FPC (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Free Pascal via Chocolatey
        shell: cmd
        run: choco install freepascal --no-progress -y

      - name: Find FPC path (debug)
        shell: cmd
        run: |
          echo === Cek C:\FPC ===
          if exist "C:\FPC" (dir "C:\FPC" /s /b) else (echo C:\FPC tidak ada)
          echo === Cek choco bin ===
          where fpc 2>nul || echo fpc tidak ada di PATH

      - name: Set FPC path
        shell: pwsh
        run: |
          $fpc = where.exe fpc 2>$null
          if ($fpc) {
            $dir = Split-Path $fpc -Parent
            Write-Host "FPC in PATH: $dir"
            echo "FPC_DIR=$dir" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\FPC") {
            $found = Get-ChildItem "C:\FPC" -Recurse -Filter "fpc.exe" | Select-Object -First 1
            if ($found) {
              Write-Host "FPC found: $($found.DirectoryName)"
              echo "FPC_DIR=$($found.DirectoryName)" >> $env:GITHUB_ENV
              echo "$($found.DirectoryName)" >> $env:GITHUB_PATH
            }
          } else {
            Write-Error "fpc.exe not found anywhere!"
            exit 1
          }

      - name: Show FPC version
        shell: cmd
        run: |
          "%FPC_DIR%\fpc.exe" -iV

      - name: Create output directories
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if not exist output mkdir output

      - name: Build DCU32INT
        shell: cmd
        run: |
          "%FPC_DIR%\fpc.exe" -Mdelphi -O2 -FUoutput -FEbin -dXMLx86 DCU32INT.dpr

      - name: Verify binary
        shell: cmd
        run: |
          dir bin\
          bin\dcu32int.exe -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: bin\dcu32int.exe
          retention-days: 30

  release:
    name: Create Windows Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dcu32int.exe
          generate_release_notes: true
