name: Build DCU32INT

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Build menggunakan Free Pascal (Windows)
  # ──────────────────────────────────────────────
  build-windows:
    name: Build with FPC (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Free Pascal via Chocolatey
        run: choco install freepascal --no-progress -y

      - name: Refresh PATH
        run: echo "C:\FPC\3.2.2\bin\x86_64-win64" >> $env:GITHUB_PATH

      - name: Show FPC version
        run: fpc -iV

      - name: Create output directories
        run: |
          New-Item -ItemType Directory -Force -Path bin
          New-Item -ItemType Directory -Force -Path output

      - name: Build DCU32INT
        run: |
          fpc `
            -Mdelphi `
            -O2 `
            -FUoutput `
            -FEbin `
            -dXMLx86 `
            DCU32INT.dpr
        # Keterangan flag:
        #   -Mdelphi  : mode kompatibilitas Delphi
        #   -O2       : optimasi level 2
        #   -FU       : folder untuk .ppu / .o (unit output)
        #   -FE       : folder untuk binary hasil kompilasi
        #   -dXMLx86  : aktifkan define XMLx86 (sesuai .dproj)

      - name: Verify binary
        run: |
          dir bin\
          .\bin\dcu32int.exe -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: bin\dcu32int.exe
          retention-days: 30

  # ──────────────────────────────────────────────
  # Release otomatis saat push tag v*.*.*
  # Contoh: git tag v1.26.1 && git push origin v1.26.1
  # ──────────────────────────────────────────────
  release:
    name: Create Windows Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dcu32int.exe
          generate_release_notes: true
