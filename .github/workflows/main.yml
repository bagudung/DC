name: Build DCU32INT

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build with FPC (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Free Pascal via Chocolatey
        run: choco install freepascal --no-progress -y

      - name: Find FPC binary path
        id: find_fpc
        run: |
          $fpcPath = Get-ChildItem -Path "C:\FPC" -Recurse -Filter "fpc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $fpcPath) {
            $fpcPath = Get-ChildItem -Path "C:\ProgramData\chocolatey" -Recurse -Filter "fpc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          }
          if (-not $fpcPath) {
            $fpcPath = Get-ChildItem -Path "C:\" -Recurse -Filter "fpc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          }
          Write-Host "FPC found at: $fpcPath"
          echo "FPC_DIR=$fpcPath" >> $env:GITHUB_ENV
          echo "$fpcPath" >> $env:GITHUB_PATH

      - name: Show FPC version
        run: |
          Write-Host "FPC dir: $env:FPC_DIR"
          & "$env:FPC_DIR\fpc.exe" -iV

      - name: Create output directories
        run: |
          New-Item -ItemType Directory -Force -Path bin
          New-Item -ItemType Directory -Force -Path output

      - name: Build DCU32INT
        run: |
          & "$env:FPC_DIR\fpc.exe" -Mdelphi -O2 -FUoutput -FEbin -dXMLx86 DCU32INT.dpr

      - name: Verify binary
        run: |
          dir bin\
          .\bin\dcu32int.exe -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: bin\dcu32int.exe
          retention-days: 30

  release:
    name: Create Windows Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dcu32int.exe
          generate_release_notes: true
