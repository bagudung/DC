name: Build DCU32INT

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build with FPC (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Free Pascal via Chocolatey
        run: choco install freepascal --no-progress -y

      - name: Set FPC path
        run: |
          # Chocolatey biasanya install FPC ke salah satu path ini
          $candidates = @(
            "C:\FPC\3.2.2\bin\x86_64-win64",
            "C:\FPC\3.2.2\bin\i386-win32",
            "C:\FPC\bin\x86_64-win64",
            "C:\FPC\bin\i386-win32"
          )
          foreach ($path in $candidates) {
            if (Test-Path "$path\fpc.exe") {
              Write-Host "FPC found: $path"
              echo "FPC_DIR=$path" >> $env:GITHUB_ENV
              echo "$path" >> $env:GITHUB_PATH
              exit 0
            }
          }
          # Fallback: cari hanya di C:\FPC (tidak rekursif ke seluruh C:\)
          $found = Get-ChildItem -Path "C:\FPC" -Recurse -Filter "fpc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            $dir = $found.DirectoryName
            Write-Host "FPC found (fallback): $dir"
            echo "FPC_DIR=$dir" >> $env:GITHUB_ENV
            echo "$dir" >> $env:GITHUB_PATH
          } else {
            Write-Error "fpc.exe not found!"
            exit 1
          }

      - name: Show FPC version
        run: fpc -iV

      - name: Create output directories
        run: |
          New-Item -ItemType Directory -Force -Path bin
          New-Item -ItemType Directory -Force -Path output

      - name: Build DCU32INT
        run: fpc -Mdelphi -O2 -FUoutput -FEbin -dXMLx86 DCU32INT.dpr

      - name: Verify binary
        run: |
          dir bin\
          .\bin\dcu32int.exe -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: bin\dcu32int.exe
          retention-days: 30

  release:
    name: Create Windows Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dcu32int.exe
          generate_release_notes: true
