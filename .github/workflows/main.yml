name: Build DCU32INT

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build with FPC (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download FPC installer
        shell: pwsh
        run: |
          $url = "https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.i386-win32.exe"
          $installer = "$env:TEMP\fpc-setup.exe"
          Write-Host "Downloading FPC..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Installing FPC..."
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=C:\FPC" -Wait
          Write-Host "Done."

      - name: Set FPC path
        shell: pwsh
        run: |
          $found = Get-ChildItem "C:\FPC" -Recurse -Filter "fpc.exe" | Select-Object -First 1
          if ($found) {
            $dir = $found.DirectoryName
            Write-Host "FPC found at: $dir"
            Add-Content $env:GITHUB_ENV "FPC_DIR=$dir"
            Add-Content $env:GITHUB_PATH "$dir"
          } else {
            Write-Error "fpc.exe not found!"
            exit 1
          }

      - name: Show FPC version
        shell: pwsh
        run: |
          & "$env:FPC_DIR\fpc.exe" -iV

      - name: Create output directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          New-Item -ItemType Directory -Force -Path output | Out-Null

      - name: Build DCU32INT
        shell: pwsh
        run: |
          & "$env:FPC_DIR\fpc.exe" -Mdelphi -O2 -FUoutput -FEbin -dXMLx86 DCU32INT.dpr

      - name: Verify binary
        shell: pwsh
        run: |
          Get-ChildItem bin\
          & ".\bin\dcu32int.exe" -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: bin\dcu32int.exe
          retention-days: 30

  release:
    name: Create Windows Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dcu32int-windows-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dcu32int.exe
          generate_release_notes: true
